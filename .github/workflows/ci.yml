name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: apartmentrenos-1575e.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: apartmentrenos-1575e
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: apartmentrenos-1575e.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "340508386543"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:340508386543:web:a34cd3cfdb52d70a6ba71a"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
